[project]
name = "gsm-memory"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyarrow==21.0.0",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
graphiti = [
  "google-genai==2.23.0",
  "graphiti-core==0.30.2",
  "httpx2==2.12.0",
  "kuzu==0.11.3",
  "neo4j==6.3.0",
  "openai==3.13.0",
  "posthog==7.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_memory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit/data", "tests/conformance/data", "tests/integration/data"]
